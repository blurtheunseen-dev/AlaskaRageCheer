<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Shop | Alaska Rage Cheer</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .shop-banner { 
      text-align: center; 
      padding: 1rem 1rem 1.5rem; 
      background: radial-gradient(circle, rgba(45, 17, 77, 0.9) 0%, rgba(11, 5, 18, 0.9) 80%); 
    }
    .shop-banner h1 { 
      font-size: 3rem; 
      color: #f1c40f; 
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
    }

    .shop-container {
      max-width: 900px;
      margin: 3rem auto;
      padding: 0 1.5rem;
      text-align: center;
    }

    .shop-card {
      background-color: rgba(23, 9, 38, 0.92);
      border: 2px solid #3d1466;
      border-radius: 8px;
      padding: 3rem 2rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .shop-card h2 {
      color: #f1c40f;
      font-size: 1.8rem;
    }

    .shop-card p {
      color: #dddddd;
      font-family: sans-serif;
      max-width: 600px;
      line-height: 1.6;
    }

    .shop-btn {
      padding: 1rem 2.5rem;
      background: #d4af37;
      color: #0b0512;
      border: none;
      border-radius: 6px;
      text-decoration: none;
      font-family: 'Arial Black', sans-serif;
      font-size: 1.1rem;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .shop-btn:hover {
      background: #f1c40f;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <header></header>

  <div class="shop-banner">
    <h1>TEAM SHOP</h1>
    <p style="color: #fff; margin-top: 0.5rem; font-family: sans-serif;">Official Alaska Rage Cheer Gear & Apparel</p>
  </div>

  <main class="shop-container">
    <div class="shop-card">
      <h2>Visit Our Official Online Store</h2>
      <p>Browse team apparel, cheer gear, and accessories directly on our official Shop storefront with secure checkout and fast shipping.</p>
      <a href="https://www.your-website-here-for-shop.com.app" target="_blank" rel="noopener noreferrer" class="shop-btn">
        Open Online Store ↗
      </a>
    </div>
  </main>

  <footer></footer>
<!-- Script that injects header & footer -->
  <script src="nav.js"></script>
</body>
</html>
